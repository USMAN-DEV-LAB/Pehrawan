name: pehrawan
description: "Pehrawan — Pakistani fashion & multi-category marketplace."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  # State & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking & Models
  dio: ^5.8.0+1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Local Storage & Connectivity
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.3

  # UI & Media
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.0
  freezed: ^4.0.0
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
          weight: 400
